name: Bootstrap environment delivery diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  direct:
    if: github.repository == 'fitchmultz/pi-subagents' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: npm
    steps:
      - name: Report only whether the environment token is present
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if test -n "$NPM_BOOTSTRAP_TOKEN"; then
            printf 'token-present=true\n'
          else
            printf 'token-present=false\n'
          fi

  reusable-unmapped:
    if: github.repository == 'fitchmultz/pi-subagents' && github.ref == 'refs/heads/main'
    uses: fitchmultz/.github/.github/workflows/npm-bootstrap-diagnostic-unmapped.yml@454c61e9f97d4d12b0acb358e86e23bedee165f6

  reusable-mapped:
    if: github.repository == 'fitchmultz/pi-subagents' && github.ref == 'refs/heads/main'
    uses: fitchmultz/.github/.github/workflows/npm-bootstrap-diagnostic-mapped.yml@454c61e9f97d4d12b0acb358e86e23bedee165f6
    secrets:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
