name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fork-ref:
        description: Exact candidate fork SHA; empty resolves maintained main
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      source-ref:
        description: Exact candidate commit; blank uses the caller commit
        type: string
        default: ""
      candidate-artifact:
        description: Prepared npm candidate artifact in this workflow run
        type: string
        default: ""
      fork-artifact:
        description: Prepared fork host artifact in this workflow run
        type: string
        default: ""
      release-source:
        description: Original main commit covered by the candidate
        type: string
        default: ""
      official-version:
        type: string
        default: ""
      fork-ref:
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PI_AUTOMATION_REF: c832dd07c016914db40bb98e5bdbb9c623cd6303 # main
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Verify candidate source
        env:
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.21.0 <25"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm run format:check && npm run check:size

  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@c832dd07c016914db40bb98e5bdbb9c623cd6303 # main
    with:
      automation-ref: c832dd07c016914db40bb98e5bdbb9c623cd6303 # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  editor:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          repository: fitchmultz/pi-apply-edits
          ref: main
          persist-credentials: false

  qualification:
    needs: [resolve, editor]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, host: official }
          - { os: ubuntu-latest, host: fork }
          # One macOS lane, on the maintained fork; official Pi stays qualified on Linux.
          - { os: macos-latest, host: fork }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PI_FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
      PI_EDITOR_RECEIPT_TEST_ROOT: ${{ github.workspace }}/editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Verify candidate source
        env:
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
        run: test "$(git -C extension rev-parse HEAD)" = "$SOURCE_REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi-apply-edits
          ref: ${{ needs.editor.outputs.ref }}
          path: editor
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.host == 'fork'
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.21.0 <25"
          check-latest: true
          package-manager-cache: false
      - name: Install native test prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y fd-find ripgrep libcap2-bin lsof
            sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          else
            brew install fd ripgrep
          fi
      - name: Use the reviewed automation npm
        run: |
          PM="$(node -p 'require("./automation/package.json").packageManager')"
          npm exec --yes --package="$PM" -- npm install --global "$PM"
      - name: Download the prepared release candidate
        if: inputs.candidate-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate-artifact }}
          path: ${{ runner.temp }}/npm-candidate
      - name: Download the prepared fork host
        if: matrix.host == 'fork' && inputs.candidate-artifact != '' && inputs.fork-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.fork-artifact }}
          path: ${{ runner.temp }}/npm-fork-host
      - name: Select the prepared fork host
        if: matrix.host == 'fork' && inputs.candidate-artifact != '' && inputs.fork-artifact != ''
        run: printf 'PI_RELEASE_FORK=%s/npm-fork-host\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the candidate before host qualification
        if: inputs.candidate-artifact != ''
        env:
          SOURCE_REF: ${{ inputs.source-ref || github.sha }}
          RELEASE_SOURCE: ${{ inputs.release-source }}
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
          FORK_REF: ${{ needs.resolve.outputs.fork-ref }}
        run: |
          node automation/scripts/npm-release.mjs verify \
            --artifact "$RUNNER_TEMP/npm-candidate" --source-ref "$SOURCE_REF" \
            --release-source "$RELEASE_SOURCE" --official-version "$OFFICIAL_VERSION" --fork-ref "$FORK_REF"
          printf 'PI_RELEASE_CANDIDATE=%s/npm-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build the resolved fork on this platform
        if: matrix.host == 'fork'
        working-directory: fork
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          PI_OFFLINE=1 PI_TELEMETRY=0 npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$PI_FORK_REF"
          git diff --exit-code
      - name: Qualify official full CI and production installs
        if: matrix.host == 'official'
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
        run: node extension/.github/scripts/ci-host.mjs official "$OFFICIAL_VERSION" automation extension
      - name: Qualify fork full CI and production installs
        if: matrix.host == 'fork'
        run: node extension/.github/scripts/ci-host.mjs fork "$RUNNER_TEMP/fork-package" automation extension

  compatibility:
    needs: [lint, resolve, editor, qualification]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected host gate
        env:
          LINT: ${{ needs.lint.result }}
          RESOLVE: ${{ needs.resolve.result }}
          EDITOR: ${{ needs.editor.result }}
          QUALIFICATION: ${{ needs.qualification.result }}
        run: test "$LINT" = success && test "$RESOLVE" = success && test "$EDITOR" = success && test "$QUALIFICATION" = success
